name: Build & Publish Rys MD (Linux, Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.3.0)'
        required: false
        default: 'v0.3.0'
  push:
    tags:
      - 'v*'

jobs:
  build-multiplatform:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            name: Linux (.deb & .AppImage)
          - platform: windows-latest
            name: Windows (.exe Setup, .msi & Portable .exe)
          - platform: macos-latest
            name: macOS (.dmg & .app)

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu WebKitGTK dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Tauri Bundles (Linux, Windows, macOS)
        run: bun run tauri:build

      - name: Prepare Windows Portable Executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cp src-tauri/target/release/rys-md.exe src-tauri/target/release/Rys-MD_0.3.0_x64-portable.exe

      - name: Prepare macOS App Archive
        if: matrix.platform == 'macos-latest'
        run: |
          cd src-tauri/target/release/bundle/macos
          tar -czf Rys-MD_0.3.0_universal-macos.app.tar.gz "Rys MD.app"

      - name: Upload Linux Artifacts
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: RysMD-Linux-Packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RysMD-Windows-Executables
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/Rys-MD_*_x64-portable.exe

      - name: Upload macOS Artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RysMD-macOS-Bundles
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz

      - name: Publish Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v0.3.0' }}
          name: "Rys MD ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v0.3.0' }}"
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/Rys-MD_*_x64-portable.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
