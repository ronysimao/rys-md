name: Build Rys MD (Linux .deb/.AppImage & Windows .exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-multiplatform:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            name: Linux (.deb & .AppImage)
          - platform: windows-latest
            name: Windows (.exe Installer & Portable .exe)

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Ubuntu WebKitGTK dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Tauri Bundles (.deb, .AppImage, .exe)
        run: bun run tauri:build

      - name: Upload Linux Artifacts (.deb & .AppImage)
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: RysMD-Linux-Packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/rys-md

      - name: Upload Windows Artifacts (Setup .exe & Portable .exe)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RysMD-Windows-Executables
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/rys-md.exe
