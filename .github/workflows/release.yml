name: Build & Publish Rys MD (Linux, Windows Portable & macOS Universal)

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.9.0)'
        required: false
        default: 'v0.9.0'
  push:
    tags:
      - 'v*'

jobs:
  build-multiplatform:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            name: Linux (.deb & .AppImage)
          - platform: windows-latest
            name: Windows (PortableApps .zip, Portable .exe, Setup .exe & .msi)
          - platform: macos-latest
            name: macOS Universal (Intel + Apple Silicon, macOS 10.15 -> Sonoma/Sequoia)

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Universal macOS Rust Targets (Intel x86_64 + Apple Silicon arm64)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Ubuntu WebKitGTK dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        run: bun install

      - name: Extract Release Version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name || 'v0.9.0' }}"
          CLEAN_VER="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"

      - name: Build Linux Packages (.deb via build-deb.sh & .AppImage)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          bash scripts/build-deb.sh
          bun run tauri build --bundles appimage

      - name: Build Windows Packages & Assemble PortableApps Edition
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          bun run tauri:build

          # Single-file Portable executables
          cp src-tauri/target/release/rys-md.exe "src-tauri/target/release/Rys-MD_${VER}_Windows_x64_Portable.exe"
          cp src-tauri/target/release/rys-md.exe "src-tauri/target/release/Rys-MD_Windows_x64_Portable.exe"

          # Complete PortableApps Self-Contained Folder (.zip)
          PORTABLE_DIR="src-tauri/target/release/Rys-MD-Portable"
          rm -rf "$PORTABLE_DIR"
          mkdir -p "$PORTABLE_DIR/Rys MD Vault"
          cp src-tauri/target/release/rys-md.exe "$PORTABLE_DIR/Rys MD Portable.exe"
          echo "Rys MD Portable Mode - Notes are saved in './Rys MD Vault'" > "$PORTABLE_DIR/portable.txt"

          cat > "$PORTABLE_DIR/Iniciar Rys MD Portable (Sem Bloqueio SmartScreen).bat" << 'BATEOF'
          @echo off
          chcp 65001 >nul
          title Rys MD Portable Launcher
          REM Remove o bloqueio Zone.Identifier (SmartScreen) aplicado pelo navegador ao baixar da internet
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-ChildItem -Path '%~dp0' -Recurse | Unblock-File -ErrorAction SilentlyContinue" >nul 2>&1
          start "" "%~dp0Rys MD Portable.exe"
          BATEOF

          cat > "$PORTABLE_DIR/LEIA-ME (Windows Portable).txt" << 'TXTEOF'
          ==================================================================
            RYS MD — EDIÇÃO PORTABLE APPS PARA WINDOWS (64-BIT)
            Site: https://md.rysdev.com
          ==================================================================

          COMO USAR (SEM INSTALAÇÃO E SEM PROBLEMAS DE ASSINATURA):
          1. Extraia toda esta pasta para qualquer local (Área de Trabalho,
             Documentos, Pendrive, OneDrive ou Dropbox).
          2. Na primeira vez, dê dois cliques em:
             "Iniciar Rys MD Portable (Sem Bloqueio SmartScreen).bat"
             (Ele desbloqueia automaticamente o executável baixado da internet
             e abre o Rys MD sem pedir senha de Administrador).
          3. Nas próximas vezes, você pode abrir diretamente pelo
             "Rys MD Portable.exe" ou pelo ".bat".

          ONDE MINHAS NOTAS FICAM SALVAS NO MODO PORTABLE?
          - Por padrão nesta edição Portable, todas as suas notas (.md) ficam
            salvas dentro da subpasta "Rys MD Vault" ao lado do executável!
          - Se preferir usar a pasta Documentos\RYS MD do Windows, basta apagar
            o arquivo "portable.txt" e a pasta "Rys MD Vault", ou alterar a
            pasta diretamente no rodapé do aplicativo.
          TXTEOF

          powershell -NoProfile -Command "Compress-Archive -Path '$PORTABLE_DIR/*' -DestinationPath 'src-tauri/target/release/Rys-MD_${VER}_Windows_x64_Portable.zip' -Force"

      - name: Build macOS Universal Binary (Intel + Apple Silicon, macOS 10.15 -> Sonoma/Sequoia)
        if: matrix.platform == 'macos-latest'
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          VER="${{ steps.ver.outputs.version }}"
          bun run tauri build --target universal-apple-darwin

          MACOS_BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          DMG_BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle/dmg"

          # Ad-hoc sign and strip any quarantine attributes so macOS Sonoma/Sequoia runs cleanly
          xattr -cr "$MACOS_BUNDLE_DIR/Rys MD.app" || true
          codesign --force --deep --sign - "$MACOS_BUNDLE_DIR/Rys MD.app" || true

          # Copy Universal DMG with clear versioned filename
          cp "$DMG_BUNDLE_DIR"/*.dmg "$DMG_BUNDLE_DIR/Rys-MD_${VER}_macOS_Universal.dmg"

          # Create Universal .app.tar.gz for 1-line Terminal installer & Auto-Updater
          cd "$MACOS_BUNDLE_DIR"
          tar -czf "Rys-MD_${VER}_macOS_Universal.app.tar.gz" "Rys MD.app"
          cp "Rys-MD_${VER}_macOS_Universal.app.tar.gz" "Rys-MD_macOS_Universal.app.tar.gz"

          # Create macOS ZIP Bundle with 1-Click Gatekeeper Unblocker for macOS Sonoma / Sequoia
          mkdir -p macos-installer-pkg
          cp -R "Rys MD.app" macos-installer-pkg/

          cat > "macos-installer-pkg/Instalar Rys MD no Mac (Desbloquear Sonoma).command" << 'CMDEOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          echo "=========================================================="
          echo "  🍎 Instalando Rys MD em /Applications e desbloqueando..."
          echo "=========================================================="
          rm -rf "/Applications/Rys MD.app" 2>/dev/null || sudo rm -rf "/Applications/Rys MD.app"
          cp -R "$DIR/Rys MD.app" "/Applications/Rys MD.app" 2>/dev/null || sudo cp -R "$DIR/Rys MD.app" "/Applications/Rys MD.app"
          xattr -cr "/Applications/Rys MD.app" 2>/dev/null || sudo xattr -cr "/Applications/Rys MD.app" || true
          codesign --force --deep --sign - "/Applications/Rys MD.app" 2>/dev/null || true
          echo "✅ Rys MD instalado e desbloqueado com sucesso! Abrindo..."
          open "/Applications/Rys MD.app"
          CMDEOF
          chmod +x "macos-installer-pkg/Instalar Rys MD no Mac (Desbloquear Sonoma).command"

          cat > "macos-installer-pkg/LEIA-ME (macOS Sonoma e anteriores).txt" << 'MACEOF'
          ==================================================================
            RYS MD — EDIÇÃO UNIVERSAL PARA MACOS (INTEL & APPLE SILICON)
            Compatível com macOS 10.15 Catalina até macOS 14 Sonoma / 15 Sequoia
          ==================================================================

          COMO INSTALAR NO MAC SEM SER BARRADO PELO GATEKEEPER (SONOMA):

          OPÇÃO A (Recomendada — 1 Comando no Terminal, sem aviso nenhum):
          Abra o app "Terminal" do Mac, cole o comando abaixo e aperte Enter:

          curl -fsSL https://raw.githubusercontent.com/ronysimao/rys-md/main/scripts/install-macos.sh | bash

          OPÇÃO B (Usando esta pasta baixada):
          1. Arraste o "Rys MD.app" para a sua pasta Aplicativos (/Applications).
          2. Se o macOS Sonoma exibir aviso de segurança ao abrir, abra o Terminal
             e rode:
             xattr -cr "/Applications/Rys MD.app" && open "/Applications/Rys MD.app"
             (Ou clique com o botão direito em "Instalar Rys MD no Mac.command" -> Abrir).
          MACEOF

          cd macos-installer-pkg
          ditto -c -k --keepParent . "../Rys-MD_${VER}_macOS_Universal_Com_Instalador.zip"

      - name: Publish Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "Rys MD ${{ steps.ver.outputs.tag }}"
          draft: false
          prerelease: false
          files: |
            release/rys-md_*_amd64.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/Rys-MD_*_Windows_x64_Portable.zip
            src-tauri/target/release/Rys-MD_*_Windows_x64_Portable.exe
            src-tauri/target/release/Rys-MD_Windows_x64_Portable.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/Rys-MD_*_macOS_Universal.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Rys-MD_*_macOS_Universal_Com_Instalador.zip
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Rys-MD_*_macOS_Universal.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/Rys-MD_macOS_Universal.app.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
