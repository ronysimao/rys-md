[package]
name = "rys-md"
version = "0.9.5"
description = "Rys MD — Apple Notes + Orca ADE Markdown Editor (https://md.rysdev.com)"
authors = ["ronysimao - RysDev <contato@rysdev.com>"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
walkdir = "2"
dirs = "5"
