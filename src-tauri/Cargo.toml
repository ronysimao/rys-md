[package]
name = "rys-md"
version = "0.1.0"
description = "Rys MD — Apple Notes + Orca ADE Markdown Editor for Ubuntu"
authors = ["Simão"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
walkdir = "2"
dirs = "5"
